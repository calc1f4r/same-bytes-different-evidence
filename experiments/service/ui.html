<!doctype html><html lang="en"><meta charset="utf-8"><title>RivaGAN raster boundary · exploratory</title><style>body{font:16px system-ui;max-width:850px;margin:25px auto;background:#f8f8f8;color:#222}label{margin:10px;display:inline-block}img{image-rendering:auto;max-width:512px;border:1px solid #555;background:white}pre{white-space:pre-wrap;word-break:break-word}button{padding:8px}</style><h1>RivaGAN raster boundary</h1><p>Exploratory CPU-only loopback service. Raw ignores EXIF orientation; canonical applies it and returns RGB PNG. Display uses only the artifact bytes returned by this service, never the local upload preview.</p><label>JPEG / canonical PNG <input id="file" type="file" accept="image/jpeg,image/png"></label><label>Path <select id="path"><option value="raw">raw JPEG</option><option value="canonical">canonical PNG</option></select></label><label>Index <input id="idx" type="number" value="46"></label><label>Key <select id="key"><option value="own">own</option><option value="wrong">wrong</option></select></label><button id="run">Send bytes to service</button><p id="state">Idle</p><img id="display" alt="Service returned raster" hidden><pre id="result"></pre><script>
document.querySelector('#run').onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file){document.querySelector('#state').textContent='Choose a file';return}const path=document.querySelector('#path').value,idx=document.querySelector('#idx').value,key=document.querySelector('#key').value;const response=await fetch(`/api/evaluate?path=${path}&idx=${idx}&key=${key}`,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});const row=await response.json();document.querySelector('#result').textContent=JSON.stringify(row,null,2);const img=document.querySelector('#display');if(row.status==='ok'){img.hidden=false;img.src=row.artifact_url;await img.decode();document.querySelector('#state').textContent=`Displayed returned ${path==='canonical'?'canonical PNG':'original JPEG'} • score ${row.score} • ${row.request_id}`}else{img.hidden=true;document.querySelector('#state').textContent=`Rejected ${row.error}`}};
</script></html>
